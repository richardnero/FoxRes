name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # 24.04 ships GTK 4.14 and libadwaita 1.5, the same API level as the snap runtime.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install GTK 4, libadwaita and validators
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev appstream desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release
      - run: appstreamcli validate --no-net data/io.foxiq.FoxRes.metainfo.xml
      - run: desktop-file-validate data/io.foxiq.FoxRes.desktop
      - run: cargo build --release --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: foxres-linux-x86_64
          path: |
            target/release/foxres
            target/release/foxres-cli

  snap:
    needs: check
    runs-on: ubuntu-24.04
    outputs:
      file: ${{ steps.build.outputs.snap }}
    steps:
      - uses: actions/checkout@v5
      - uses: snapcore/action-build@v1
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: foxres-snap
          path: ${{ steps.build.outputs.snap }}

  # Push a tag such as v0.1.0 to publish to the Snap Store (stable channel).
  # Needs the SNAPCRAFT_STORE_CREDENTIALS repository secret.
  publish:
    needs: snap
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: foxres-snap
      - id: find
        run: echo "snap=$(ls *.snap | head -n1)" >> "$GITHUB_OUTPUT"
      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.find.outputs.snap }}
          release: stable
