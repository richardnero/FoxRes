name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # 24.04 ships GTK 4.14 and libadwaita 1.5, the same API level as the snap runtime.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install GTK 4, libadwaita and validators
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev appstream desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release
      - run: appstreamcli validate --no-net data/io.foxiq.FoxRes.metainfo.xml
      - run: desktop-file-validate data/io.foxiq.FoxRes.desktop
      - run: cargo build --release --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: foxres-linux-x86_64
          path: |
            target/release/foxres
            target/release/foxres-cli

  # Each snap is built natively on its own architecture.
  snap:
    needs: check
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: snapcore/action-build@v1
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: foxres-snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}

  # Install each snap on a clean machine, as a user would, and run it. The
  # command line loads the same binary and GNOME runtime as the window does.
  snap-test:
    needs: snap
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: foxres-snap-${{ matrix.arch }}
      - name: Install the snap with strict confinement
        run: sudo snap install --dangerous ./*.snap
      - name: Run it
        run: |
          set -e
          snap list foxres gnome-46-2404
          foxres --version
          foxres --json smd 472 | jq -e '.ohms == 4700'
          foxres --json rtd --temp 100 | jq -e '(.ohms - 138.5055) | fabs < 1e-9'
          foxres divider --vin 12 --vout 3.3

  # Push a tag such as v0.2.1 to publish both architectures to the Snap Store
  # (stable channel). Needs the SNAPCRAFT_STORE_CREDENTIALS repository secret.
  publish:
    needs: [snap, snap-test]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: foxres-snap-${{ matrix.arch }}
      - id: find
        run: echo "snap=$(ls *.snap | head -n1)" >> "$GITHUB_OUTPUT"
      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.find.outputs.snap }}
          release: stable
