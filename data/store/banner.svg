<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="640" viewBox="0 0 1920 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241610"/>
      <stop offset="0.55" stop-color="#3a2115"/>
      <stop offset="1" stop-color="#6a3115"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.79" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#ff9a4d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff9a4d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.10"/>
      <stop offset="0.22" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#000" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef0f2"/>
      <stop offset="0.45" stop-color="#b5b9bd"/>
      <stop offset="1" stop-color="#6d7276"/>
    </linearGradient>
    <clipPath id="body"><rect x="1330" y="255" width="440" height="130" rx="50"/></clipPath>
  </defs>

  <rect width="1920" height="640" fill="url(#bg)"/>
  <rect width="1920" height="640" fill="url(#glow)"/>

  <!-- App icon -->
  <svg x="140" y="196" width="248" height="248" viewBox="0 0 128 128">
    <defs>
        <linearGradient id="icon-bg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffb877"/>
          <stop offset="1" stop-color="#dd5f22"/>
        </linearGradient>
        <linearGradient id="icon-gloss" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
          <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="icon-wire" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#eef0f2"/>
          <stop offset="0.45" stop-color="#aeb3b8"/>
          <stop offset="1" stop-color="#5f6468"/>
        </linearGradient>
        <linearGradient id="icon-shade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity="0.10"/>
          <stop offset="0.22" stop-color="#fff" stop-opacity="0.50"/>
          <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
          <stop offset="0.75" stop-color="#000" stop-opacity="0.08"/>
          <stop offset="1" stop-color="#000" stop-opacity="0.38"/>
        </linearGradient>
        <clipPath id="icon-body"><rect x="29" y="45" width="70" height="38" rx="15"/></clipPath>
      </defs>
    
      <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#icon-bg)"/>
      <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#icon-gloss)"/>
      <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" fill="none" stroke="#000" stroke-opacity="0.12"/>
    
      <rect x="13" y="61" width="102" height="6" rx="3" fill="url(#icon-wire)"/>
    
      <rect x="29" y="47" width="70" height="38" rx="15" fill="#000" opacity="0.18"/>
      <g clip-path="url(#icon-body)">
        <rect x="29" y="45" width="70" height="38" fill="#e7cd9d"/>
        <rect x="39" y="45" width="7" height="38" fill="#ffd200"/>
        <rect x="51" y="45" width="7" height="38" fill="#8a2be2"/>
        <rect x="63" y="45" width="7" height="38" fill="#d01c1c"/>
        <rect x="82" y="45" width="7" height="38" fill="#cfb53b"/>
        <rect x="29" y="45" width="70" height="38" fill="url(#icon-shade)"/>
      </g>
      <rect x="29" y="45" width="70" height="38" rx="15" fill="none" stroke="#6b4a1f" stroke-opacity="0.45"/>
  </svg>

  <!-- Title -->
  <text x="432" y="292" font-family="Ubuntu, Cantarell, 'Noto Sans', sans-serif" font-size="112" font-weight="700" fill="#fff4ea">FoxRes</text>
  <text x="436" y="356" font-family="Ubuntu, Cantarell, 'Noto Sans', sans-serif" font-size="36" fill="#f3d2b8">Resistor color codes, SMD markings</text>
  <text x="436" y="402" font-family="Ubuntu, Cantarell, 'Noto Sans', sans-serif" font-size="36" fill="#f3d2b8">and E-series values</text>
  <text x="436" y="458" font-family="Ubuntu, Cantarell, 'Noto Sans', sans-serif" font-size="28" fill="#d9a988">Exact by design  ·  App and command line  ·  by FoxIQ</text>

  <!-- Large resistor -->
  <rect x="1250" y="309" width="600" height="22" rx="11" fill="url(#wire)"/>
  <rect x="1330" y="261" width="440" height="130" rx="50" fill="#000" opacity="0.25"/>
  <g clip-path="url(#body)">
    <rect x="1330" y="255" width="440" height="130" fill="#e3c99a"/>
    <rect x="1395" y="255" width="34" height="130" fill="#ffd700"/>
    <rect x="1458" y="255" width="34" height="130" fill="#8a2be2"/>
    <rect x="1521" y="255" width="34" height="130" fill="#d01c1c"/>
    <rect x="1652" y="255" width="34" height="130" fill="#cfb53b"/>
    <rect x="1330" y="255" width="440" height="130" fill="url(#shade)"/>
  </g>
  <rect x="1330" y="255" width="440" height="130" rx="50" fill="none" stroke="#000" stroke-opacity="0.3" stroke-width="2"/>
  <text x="1550" y="462" text-anchor="middle" font-family="Ubuntu, Cantarell, 'Noto Sans', sans-serif" font-size="46" font-weight="700" fill="#fff4ea">4.7 kΩ  ±5 %</text>
</svg>
